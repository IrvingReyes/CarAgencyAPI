services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: car_agency
      POSTGRES_PASSWORD: car_agency
      POSTGRES_DB: car_agency
    ports:
      # 5433 on the host to avoid clashing with a local Postgres (e.g. Odoo's) on 5432
      - "5433:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<version>, so mount the parent dir
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_agency -d car_agency"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://car_agency:car_agency@db:5432/car_agency
      # Read from the .env file next to this compose file
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      FIRST_USER_EMAIL: ${FIRST_USER_EMAIL:-}
      FIRST_USER_PASSWORD: ${FIRST_USER_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
